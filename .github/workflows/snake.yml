# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica as imagens no branch "output" (usado pelo README).
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 3h de Brasília
  workflow_dispatch:       # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#1A6BF5&color_dots=#EBEDF0,#CFE0FF,#5AB0FF,#1A6BF5,#0F4FD1
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#5AB0FF&color_dots=#161B22,#0F2F66,#0F4FD1,#1A6BF5,#5AB0FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
